<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Discord送信フォーム</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #2c2f33;
    font-family: sans-serif;
  }
  .box {
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    text-align: center;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    background: #5865F2;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #4752c4; }
  #status { margin-top: 10px; font-size: 14px; color: #333; }
</style>
</head>
<body>
  <div class="box">
    <h3>メッセージ送信</h3>
    <input type="text" id="msg" placeholder="文字を入力..." />
    <button onclick="send()">送信</button>
    <div id="status"></div>
  </div>

<script>
  // ★ここに再発行したWebhook URLを入れてください
  const WEBHOOK_URL = "https://discord.com/api/webhooks/xxxxxxxx/yyyyyyyy";

  async function send() {
    const text = document.getElementById("msg").value;
    const status = document.getElementById("status");
    if (!text) { status.textContent = "文字を入力してください"; return; }

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: text })
      });
      if (res.ok) {
        status.textContent = "送信しました！";
        document.getElementById("msg").value = "";
      } else {
        status.textContent = "送信失敗: " + res.status;
      }
    } catch (e) {
      status.textContent = "エラー: " + e.message;
    }
  }
</script>
</body>
</html>
