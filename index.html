<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投票アプリ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 24px;
    color: #333;
    margin-bottom: 24px;
    text-align: center;
  }
  .option {
    margin-bottom: 16px;
  }
  .option-btn {
    width: 100%;
    padding: 18px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    background: #667eea;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .option-btn:hover { background: #5568d3; }
  .option-btn:active { transform: scale(0.98); }
  .option-btn.voted {
    background: #48bb78;
    cursor: default;
  }
  .option-btn:disabled { opacity: 0.9; }
  .count {
    background: rgba(255,255,255,0.3);
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 14px;
  }
  .bar-wrap {
    height: 8px;
    background: #e2e8f0;
    border-radius: 4px;
    margin-top: 8px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    background: #667eea;
    width: 0%;
    transition: width 0.4s ease;
  }
  .total {
    text-align: center;
    margin-top: 24px;
    color: #666;
    font-size: 14px;
  }
  .msg {
    text-align: center;
    margin-top: 16px;
    color: #48bb78;
    font-weight: bold;
    min-height: 20px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>どっちがいい？</h1>

  <div class="option">
    <button class="option-btn" data-id="swiss" onclick="vote('swiss')">
      <span>スイスラ</span>
      <span class="count" id="count-swiss">0</span>
    </button>
    <div class="bar-wrap"><div class="bar" id="bar-swiss"></div></div>
  </div>

  <div class="option">
    <button class="option-btn" data-id="mesa" onclick="vote('mesa')">
      <span>目砂</span>
      <span class="count" id="count-mesa">0</span>
    </button>
    <div class="bar-wrap"><div class="bar" id="bar-mesa"></div></div>
  </div>

  <div class="total">合計投票数: <span id="total">0</span></div>
  <div class="msg" id="msg"></div>
</div>

<script>
  const votes = { swiss: 0, mesa: 0 };
  let hasVoted = false;

  function vote(id) {
    if (hasVoted) {
      document.getElementById('msg').textContent = '投票は1回までです';
      return;
    }
    votes[id]++;
    hasVoted = true;

    // ボタン無効化
    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.disabled = true;
      if (btn.dataset.id === id) btn.classList.add('voted');
    });

    document.getElementById('msg').textContent =
      (id === 'swiss' ? 'スイスラ' : '目砂') + ' に投票しました！';

    render();
  }

  function render() {
    const total = votes.swiss + votes.mesa;
    document.getElementById('count-swiss').textContent = votes.swiss;
    document.getElementById('count-mesa').textContent = votes.mesa;
    document.getElementById('total').textContent = total;

    document.getElementById('bar-swiss').style.width =
      total ? (votes.swiss / total * 100) + '%' : '0%';
    document.getElementById('bar-mesa').style.width =
      total ? (votes.mesa / total * 100) + '%' : '0%';
  }

  render();
</script>
</body>
</html>
