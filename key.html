<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Display</title>
    <style>
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .box { background: #1e1e1e; display: inline-block; padding: 30px; border-radius: 12px; border: 1px solid #333; }
        .key { font-size: 24px; color: #00ff88; font-weight: bold; background: #2a2a2a; padding: 10px 20px; border-radius: 6px; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎉 広告通過完了！</h2>
        <p>今回のキーはこちらです。コピーしてゲーム内で使用してください。</p>
        <div class="key">KEY-2026-HAPPY</div>
    </div>
</body>
</html>
